<g class="line"><text x="42" y="94">$ printf '%s\n' 'Abcdef123' | ./password_checker</text><text x="42" y="125">=== Password Strength Checker ===</text><text x="42" y="156">Enter a password (maximum 255 characters):</text><text x="42" y="187">--- Password Requirements ---</text><text x="42" y="218">Length greater than 8: PASS (length: 9)</text><text x="42" y="249">Contains uppercase letter: PASS</text><text x="42" y="280">Contains lowercase letter: PASS</text><text x="42" y="311">Contains a number: PASS</text><text x="42" y="342">Contains a symbol: FAIL</text><text x="42" y="373">Result: The password does not meet all requirements.</text></g>
