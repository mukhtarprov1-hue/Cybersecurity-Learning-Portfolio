  <text x="118" y="43" class="title">STRICT BUILD / INTEGRATION TESTS</text><text x="1464" y="43" text-anchor="end" class="tag">RENDERED FROM CAPTURED TERMINAL LOG</text>
  <text x="42" y="112" class="line">$ gcc -std=c17 -Wall -Wextra -Wpedantic -Werror -O2 log_parser.c -o log_parser</text><text x="42" y="139" class="line">Compiler: gcc (Debian 14.2.0-19) 14.2.0</text><text x="42" y="166" class="line">Python: Python 3.13.5</text><text x="42" y="193" class="line">[BUILD PASS]</text><text x="42" y="220" class="line">$ python3 tests/run_tests.py ./log_parser</text><text x="42" y="247" class="line">[PASS] Keyword extraction and exact line numbers</text><text x="42" y="274" class="line">[PASS] 404 keyword extraction</text><text x="42" y="301" class="line">[PASS] Case-sensitive strstr behavior</text><text x="42" y="328" class="line">[PASS] Count once per matching line</text><text x="42" y="355" class="line">[PASS] No matching records</text><text x="42" y="382" class="line">[PASS] Empty log file</text><text x="42" y="409" class="line">[PASS] Missing log file error</text><text x="42" y="436" class="line">[PASS] Missing and empty arguments</text><text x="42" y="463" class="line">[PASS] Long line and keyword across fgets chunks</text><text x="42" y="490" class="line">[PASS] Large log file and line-number accuracy</text><text x="42" y="517" class="line"></text><text x="42" y="544" class="line">Test summary: 10 passed, 0 failed</text>
