name: Assignment 06 - Banner Grabbing Tool

on:
  push:
    paths:
      - 'course-assignments/06-banner-grabbing-tool/**'
      - '.github/workflows/assignment-06-banner-grabber.yml'
  pull_request:
    paths:
      - 'course-assignments/06-banner-grabbing-tool/**'
      - '.github/workflows/assignment-06-banner-grabber.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python \${{ matrix.python-version }} / \${{ matrix.os }}
    runs-on: \${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: course-assignments/06-banner-grabbing-tool
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Compile Python files
        run: python -m py_compile banner_grabber.py tests/test_banner_grabber.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
