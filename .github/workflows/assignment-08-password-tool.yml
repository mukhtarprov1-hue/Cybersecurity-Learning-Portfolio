name: Assignment 08 - Password Generator and SHA-256 Hasher

on:
  push:
    paths:
      - 'course-assignments/08-password-generator-sha256-hasher/**'
      - '.github/workflows/assignment-08-password-tool.yml'
  pull_request:
    paths:
      - 'course-assignments/08-password-generator-sha256-hasher/**'
      - '.github/workflows/assignment-08-password-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: course-assignments/08-password-generator-sha256-hasher
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python files
        run: python -m py_compile password_tool.py tests/test_password_tool.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify SHA-256 sample
        run: python password_tool.py hash "abc"
      - name: Generate disposable sample password
        run: python password_tool.py generate --length 16 --count 1
