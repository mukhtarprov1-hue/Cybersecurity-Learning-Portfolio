name: Assignment 09 - File Integrity Monitoring

on:
  push:
    paths:
      - 'course-assignments/09-file-integrity-monitoring/**'
      - '.github/workflows/assignment-09-fim.yml'
  pull_request:
    paths:
      - 'course-assignments/09-file-integrity-monitoring/**'
      - '.github/workflows/assignment-09-fim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: course-assignments/09-file-integrity-monitoring
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python files
        run: python -m py_compile fim_tool.py tests/test_fim_tool.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
